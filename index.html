<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AnimaPro - Art Studio</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { 
            --bg: #121212; 
            --surface: #1e1e1e; 
            --primary: #bb86fc; 
            --secondary: #03dac6; 
            --text: #ffffff;
            --danger: #cf6679;
        }

        /* --- GLOBAL RESET --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            overflow: hidden; 
        }
        
        body { display: flex; flex-direction: column; }
        .screen { display: none; flex-direction: column; height: 100%; width: 100%; position: relative; }
        .active { display: flex; }

        /* --- CARD UI (Restored) --- */
        .center-wrapper {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; width: 100%; padding: 20px;
        }

        .card { 
            background: var(--surface); border-radius: 20px; padding: 25px; 
            width: 100%; max-width: 400px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;
            display: flex; flex-direction: column;
            max-height: 90vh; /* Prevents card from going off screen */
        }

        input[type=text] { 
            background: #2c2c2c; border: 1px solid #444; color: white; padding: 12px; 
            border-radius: 10px; width: 100%; margin-bottom: 10px; outline: none; font-size: 16px; 
        }
        .btn { 
            background: var(--primary); color: #000; border: none; padding: 12px; 
            border-radius: 10px; font-weight: 700; width: 100%; font-size: 16px; 
            cursor: pointer; text-transform: uppercase; margin-top: 5px;
        }
        .btn:active { opacity: 0.8; }

        /* --- CHAT & LEADERBOARD --- */
        .chat-container {
            flex: 1; /* Fills available space in card */
            background: #252525; border-radius: 10px; margin: 10px 0; 
            padding: 10px; overflow-y: auto; text-align: left; font-size: 13px;
            min-height: 100px; border: 1px solid #333;
        }
        .chat-msg { padding: 3px 0; border-bottom: 1px solid #333; }
        .chat-msg:last-child { border-bottom: none; }
        
        .rank-row { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #333; font-size: 14px; }
        .rank-row span:nth-child(2) { color: var(--secondary); font-weight: bold; }

        /* --- STUDIO (Robust Layout) --- */
        .studio-header {
            flex-shrink: 0; height: 50px; background: var(--surface); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 15px; z-index: 10; border-bottom: 1px solid #333;
        }
        .timer-badge { background: #333; padding: 5px 12px; border-radius: 20px; font-weight: bold; color: var(--secondary); font-family: monospace; }

        #viewport { 
            flex-grow: 1; background: #333; overflow: auto; 
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        
        #canvas-transformer { 
            margin: 50px; /* Scroll space */
            transform-origin: center center; 
            box-shadow: 0 0 50px rgba(0,0,0,0.5); 
        }
        canvas { display: block; background: white; touch-action: none; }

        /* --- TOOLBAR (Fixed Bottom) --- */
        .tools-dock {
            flex-shrink: 0; background: var(--surface); 
            padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom));
            border-top: 1px solid #444; display: flex; justify-content: space-around; 
            align-items: center; z-index: 100;
        }
        .tool-icon { 
            width: 45px; height: 45px; border-radius: 50%; background: #444; 
            display: flex; align-items: center; justify-content: center; font-size: 20px; 
            border: 2px solid transparent; cursor: pointer;
        }
        .tool-icon.active { border-color: var(--primary); color: var(--primary); background: #2a2a2a; }

        /* --- POPUPS --- */
        .color-modal {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: var(--surface); padding: 20px; border-radius: 20px; 
            border: 1px solid #444; display: none; flex-direction: column; align-items: center; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 200; width: 220px;
        }
        .color-wheel {
            width: 150px; height: 150px; border-radius: 50%;
            background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
            position: relative; margin-bottom: 10px; border: 2px solid white;
        }
        .range-wrap { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 12px; color: #aaa; margin-top: 5px; }
        input[type=range] { flex: 1; accent-color: var(--primary); }
    </style>
</head>
<body>

    <div id="screen-login" class="screen active">
        <div class="center-wrapper">
            <div class="card">
                <h1 style="color:var(--primary); margin-bottom:5px;">AnimaPro</h1>
                <p style="color:#888; margin-bottom:20px;">*𝘮𝘢𝘴𝘪𝘩 𝘥𝘢𝘭𝘢𝘮 𝘵𝘢𝘩𝘢𝘱 𝘱𝘦𝘯𝘨𝘦𝘮𝘣𝘢𝘯𝘨𝘢𝘯</p>
                
                <input type="text" id="username" placeholder="Artist Name">
                <button class="btn" onclick="login()">Enter Studio</button>
                
                <div style="margin-top:20px; text-align:left;">
                    <small style="color:#888;">Global Leaderboard</small>
                    <div id="leaderboard" style="background:#252525; padding:10px; border-radius:10px; height:120px; overflow-y:auto;">
                        Loading...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-lobby" class="screen">
        <div class="center-wrapper">
            <div class="card" style="height: 80vh;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2 id="welcome-msg" style="margin:0;">Lobby</h2>
                    <button style="background:none; border:none; color:#666;" onclick="location.reload()">Logout</button>
                </div>
                
                <div class="chat-container" id="chat-box"></div>
                <div style="display:flex; gap:8px; margin-bottom:15px;">
                    <input type="text" id="chat-input" placeholder="Type a message..." style="margin:0; padding:12px;">
                    <button class="btn" style="width:auto; padding:0 20px; margin:0;" onclick="sendChat()">Send</button>
                </div>

                <div style="border-top: 1px solid #333; padding-top:15px;">
                    <input type="text" id="room-code" placeholder="Room Code (e.g. 1234)">
                    <button class="btn" style="background:var(--secondary);" onclick="joinRoom()">Join / Reset Room</button>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-studio" class="screen">
        <div class="studio-header">
            <span class="timer-badge" id="timer-display">00:00</span>
            <button id="start-btn" class="btn" style="background:var(--secondary); width:auto; padding:6px 15px; font-size:12px; display:none;" onclick="startGame()">START</button>
            <button class="btn" style="background:var(--danger); width:auto; padding:6px 15px; font-size:12px; margin:0;" onclick="location.reload()">EXIT</button>
        </div>

        <div id="viewport">
            <div id="canvas-transformer">
                <canvas id="canvas"></canvas>
            </div>
        </div>

        <div class="color-modal" id="color-modal">
            <div class="color-wheel" id="color-wheel-ui"></div>
            <div class="range-wrap"><span>Zoom</span><input type="range" min="0.5" max="2.0" step="0.1" value="0.8" oninput="setZoom(this.value)"></div>
        </div>

        <div class="tools-dock">
            <div class="tool-icon" id="color-trigger" style="background:conic-gradient(red, yellow, lime, aqua, blue, magenta, red); border:2px solid white;" onclick="toggleColorMenu()"></div>
            <div class="range-wrap" style="width:70px; flex-direction:column; gap:2px;">
                <span style="font-size:9px;">SIZE</span>
                <input type="range" id="brush-size" min="2" max="60" value="10">
            </div>
            <div class="tool-icon" onclick="undo()">↩</div>
            <div class="tool-icon" id="eraser-tool" onclick="toggleEraser()">🧹</div>
            <div class="tool-icon" onclick="fillCanvas()">🪣</div>
        </div>
    </div>

    <div id="screen-vote" class="screen">
        <div style="padding:20px; overflow-y:auto; flex:1;">
            <h2 style="text-align:center;">Vote for the Best!</h2>
            <div id="vote-grid" style="display:grid; gap:15px;"></div>
        </div>
        <button class="btn" onclick="location.reload()" style="margin:20px; width:calc(100% - 40px);">Back to Lobby</button>
    </div>

    <script>
        // CONFIG
        const firebaseConfig = { 
            apiKey: "AIzaSyDjpnJNwBUerDEJB1YHLKayfoKXPRi9n9o", 
            databaseURL: "https://animapro-2a586-default-rtdb.firebaseio.com",
            projectId: "animapro-2a586",
            appId: "1:575552914500:web:30890c17d549ca5cc9a811"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // VARS
        let user = localStorage.getItem("animapro_user") || "";
        let room = "", currentColor = "#000000", isEraser = false, zoomLevel = 0.8, history = [];
        const cvs = document.getElementById('canvas');
        const ctx = cvs.getContext('2d');
        const transformer = document.getElementById('canvas-transformer');

        // INIT
        if(user) { document.getElementById('username').value = user; }
        initLeaderboard();

        // CHAT (Fixed Logic)
        function initChat() {
            db.ref('globalChat').limitToLast(50).on('value', snap => {
                let d = document.getElementById('chat-box'); 
                d.innerHTML = "";
                if(snap.exists()){
                    snap.forEach(m => {
                        let div = document.createElement('div');
                        div.className = "chat-msg";
                        div.innerHTML = `<span style="color:var(--primary); font-weight:bold;">${m.val().u}:</span> ${m.val().t}`;
                        d.appendChild(div);
                    });
                }
                d.scrollTop = d.scrollHeight;
            });
            
            // Add Enter Key Listener
            document.getElementById('chat-input').addEventListener("keyup", function(event) {
                if (event.key === "Enter") sendChat();
            });
        }

        function sendChat() {
            let input = document.getElementById('chat-input');
            let t = input.value.trim();
            if(!t || !user) return; // Prevent empty or anon chat
            db.ref('globalChat').push({u: user, t: t});
            input.value = "";
        }

        // AUTH
        async function login() {
            let name = document.getElementById('username').value.trim();
            if(!name) return alert("Please enter a name");
            const snap = await db.ref('users/'+name).once('value');
            if(!user && snap.exists()) return alert("Name taken!");
            
            user = name; localStorage.setItem("animapro_user", user);
            if(!snap.exists()) db.ref('users/'+user).set({totalStars:0});
            
            document.getElementById('welcome-msg').innerText = "Lobby: " + user;
            switchScreen('screen-lobby');
            initChat();
        }

        // LEADERBOARD
        function initLeaderboard() {
            db.ref('users').orderByChild('totalStars').limitToLast(10).on('value', snap => {
                let list = [];
                snap.forEach(c => list.push({n: c.key, s: c.val().totalStars||0}));
                list.sort((a,b) => b.s - a.s);
                let h = "";
                list.forEach((p, i) => h += `<div class="rank-row"><span>#${i+1} ${p.n}</span><span>${p.s} ★</span></div>`);
                document.getElementById('leaderboard').innerHTML = h || "No players yet";
            });
        }

        // GAME LOBBY
        async function joinRoom() {
            room = document.getElementById('room-code').value.trim();
            if(!room) return;
            // Force Reset
            await db.ref('rooms/'+room).remove(); 
            
            db.ref('rooms/'+room+'/status').on('value', s => {
                if(s.val() === "PLAYING") startStudio();
                if(s.val() === "VOTING") startVoting();
                if(!s.val()) document.getElementById('start-btn').style.display = 'block';
            });
            switchScreen('screen-studio');
            setupCanvas();
        }

        function startStudio() {
            document.getElementById('start-btn').style.display = 'none';
            setupCanvas();
        }

        function startGame() {
            document.getElementById('start-btn').style.display = 'none';
            db.ref('rooms/'+room+'/status').set("PLAYING");
            let t = 180;
            let tm = setInterval(() => {
                t--; db.ref('rooms/'+room+'/timer').set(t);
                if(t<=0) { clearInterval(tm); submitArt(); }
            }, 1000);
            db.ref('rooms/'+room+'/timer').on('value', v => {
                let s = v.val()||0; document.getElementById('timer-display').innerText = Math.floor(s/60)+":"+(s%60).toString().padStart(2,'0');
            });
        }

        // CANVAS
        function setupCanvas() {
            cvs.width = 600; cvs.height = 800;
            ctx.fillStyle = "white"; ctx.fillRect(0,0,600,800);
            ctx.lineCap = "round"; ctx.lineJoin = "round";
            saveState(); setZoom(0.8);

            let isDraw = false;
            const getPos = (e) => {
                const rect = cvs.getBoundingClientRect();
                const t = e.touches[0];
                return {
                    x: (t.clientX - rect.left) * (cvs.width / rect.width),
                    y: (t.clientY - rect.top) * (cvs.height / rect.height)
                };
            };

            cvs.addEventListener('touchstart', e => { e.preventDefault(); isDraw=true; let p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }, {passive:false});
            cvs.addEventListener('touchmove', e => {
                if(!isDraw) return;
                let p=getPos(e);
                ctx.lineWidth = document.getElementById('brush-size').value;
                ctx.strokeStyle = isEraser ? "white" : currentColor;
                ctx.lineTo(p.x, p.y); ctx.stroke();
            }, {passive:false});
            cvs.addEventListener('touchend', () => { isDraw=false; saveState(); });
        }

        // TOOLS
        function setZoom(val) {
            zoomLevel = parseFloat(val);
            transformer.style.transform = `scale(${zoomLevel})`;
            transformer.style.width = (600 * zoomLevel) + "px"; // Important for scrolling
        }

        const colorWheel = document.getElementById('color-wheel-ui');
        colorWheel.addEventListener('click', (e) => {
            const rect = colorWheel.getBoundingClientRect();
            let x = e.clientX - rect.left - 75; // Half of 150
            let y = e.clientY - rect.top - 75;
            let angle = Math.atan2(y, x) * (180 / Math.PI);
            if(angle < 0) angle += 360;
            angle = (angle + 90) % 360;
            currentColor = `hsl(${angle}, 100%, 50%)`;
            document.getElementById('color-trigger').style.backgroundColor = currentColor;
            isEraser = false; document.getElementById('eraser-tool').classList.remove('active');
            toggleColorMenu();
        });

        function toggleColorMenu() { let m=document.getElementById('color-modal'); m.style.display=m.style.display==='flex'?'none':'flex'; }
        function toggleEraser() { isEraser=!isEraser; document.getElementById('eraser-tool').classList.toggle('active'); }
        function fillCanvas() { if(confirm("Fill Canvas?")){ ctx.fillStyle=currentColor; ctx.fillRect(0,0,600,800); saveState(); } }
        function undo() { if(history.length<=1)return; history.pop(); let i=new Image(); i.src=history[history.length-1]; i.onload=()=>{ ctx.fillStyle="white"; ctx.fillRect(0,0,600,800); ctx.drawImage(i,0,0); }; }
        function saveState() { if(history.length>10) history.shift(); history.push(cvs.toDataURL('image/jpeg', 0.5)); }

        // VOTE
        function submitArt() {
            db.ref('rooms/'+room+'/status').set("VOTING");
            db.ref('rooms/'+room+'/submissions/'+user).set({img: cvs.toDataURL('image/jpeg', 0.5), votes:0});
        }
        function startVoting() {
            switchScreen('screen-vote');
            db.ref('rooms/'+room+'/submissions').on('value', snap => {
                let g=document.getElementById('vote-grid'); g.innerHTML="";
                snap.forEach(s => {
                    let d=document.createElement('div'); d.className='card'; d.style.padding="10px";
                    d.innerHTML=`<img src="${s.val().img}" style="width:100%"><br><b>${s.key}</b>: ${s.val().votes}★`;
                    if(s.key!==user) d.onclick=()=>{ 
                        db.ref(`rooms/${room}/submissions/${s.key}/votes`).transaction(v=>v+1);
                        db.ref(`users/${s.key}/totalStars`).transaction(v=>(v||0)+1);
                        d.style.border="3px solid cyan";
                    };
                    g.appendChild(d);
                });
            });
        }

        function switchScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    </script>
</body>
</html>
